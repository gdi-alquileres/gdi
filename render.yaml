databases:
  - name: gdi-alquileres-db
    databaseName: gdi
    user: gdi
    plan: basic-256mb

services:
  - type: web
    name: gdi-alquileres-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: GDI Alquileres
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 10080
      - key: DATABASE_URL
        fromDatabase:
          name: gdi-alquileres-db
          property: connectionString
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: BOOTSTRAP_ADMIN_SECRET
        sync: false
